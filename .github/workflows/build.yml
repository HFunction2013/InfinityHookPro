name: Build InfinityHookPro

on:
  push:
    tags:
      - 'build-*'

jobs:
  build:
    name: Build ${{ matrix.configuration }} ${{ matrix.platform }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
        platform: [x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore WDK NuGet packages
        run: nuget restore InfinityHookPro.sln -PackagesDirectory .\packages\

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build driver
        run: |
          msbuild InfinityHookPro.sln `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /p:WindowsTargetPlatformVersion=10.0.22621.0 `
            /m /nologo /v:minimal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InfinityHookPro-${{ matrix.configuration }}-${{ matrix.platform }}
          path: |
            **/*.sys
            **/*.inf
          if-no-files-found: error
